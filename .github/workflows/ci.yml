name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:prose
      - run: npm run check:layering
      - run: npm run check:dynamic-page
      - run: npm run build
      - run: npm test

      # The committed artifact has to survive recomputation from the fixtures
      # it came from, or the numbers in the README are not evidence of
      # anything.
      - run: npm run check:evidence
